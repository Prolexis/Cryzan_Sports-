name: cryzan-sport-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: cryzan_sport_app_prod
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: cryzan_sport_db_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryzan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryzan123}
      POSTGRES_DB: ${POSTGRES_DB:-cryzan_sport_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryzan} -d ${POSTGRES_DB:-cryzan_sport_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_prod_data:
